<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Uttar Grade</title>
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap { max-width: 420px; margin: 0 auto; padding: 90px 24px 60px; }
  .auth-card { background: var(--paper-card); border: 1px solid var(--rule); border-left: 3px solid var(--red-pen); padding: 36px 32px; }
  .auth-card h1 { font-size: 24px; margin-bottom: 8px; }
  .auth-card > p { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 26px; }
  .auth-toggle { display: flex; border: 1px solid var(--ink-faint); margin-bottom: 22px; }
  .auth-toggle button {
    flex: 1; padding: 10px; border: none; background: transparent; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  }
  .auth-toggle button.active { background: var(--ink); color: var(--paper); }
  .otp-boxes { display: flex; gap: 10px; margin-bottom: 20px; }
  .otp-boxes input {
    width: 44px; height: 52px; text-align: center; font-size: 20px;
    border: 1px solid var(--ink-faint); font-family: 'IBM Plex Sans', sans-serif;
  }
  .back-link { font-size: 13.5px; color: var(--ink-soft); text-decoration: none; display: inline-block; margin-top: 14px; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="38" height="38" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
        <rect x="6" y="6" width="28" height="28" fill="var(--ink)"/>
        <text x="20" y="25" text-anchor="middle" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="var(--paper)">UG</text>
        <line x1="12" y1="30.5" x2="28" y2="30.5" stroke="var(--red-pen)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Uttar <em>Grade</em></span>
    </a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div id="stepRequest">
      <h1>Log in</h1>
      <p>We'll send a one-time code to verify it's you.</p>
      <div class="auth-toggle">
        <button id="tabEmail" class="active" type="button">Email</button>
        <button id="tabPhone" type="button">Phone</button>
      </div>
      <form id="requestForm">
        <div class="field">
          <label for="identifier" id="identifierLabel">Email address</label>
          <input type="text" id="identifier" required placeholder="you@example.com" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send code</button>
      </form>
    </div>

    <div id="stepOtp" style="display:none;">
      <h1>Enter the code</h1>
      <p id="otpSentTo">Sent to your email/phone.</p>
      <form id="otpForm">
        <div class="otp-boxes">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Verify &amp; continue</button>
      </form>
      <a href="#" class="back-link" id="backLink">← Use a different email or phone</a>
    </div>
  </div>
</div>

<script>
 <script>
  const SEND_OTP = 'https://pdzhoilcfbqrimkqtcsy.supabase.co/functions/v1/send-otp';
  const VERIFY_OTP = 'https://pdzhoilcfbqrimkqtcsy.supabase.co/functions/v1/verify-otp';

  const input = document.getElementById('identifier');
  let currentEmail = '';

  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    currentEmail = input.value.trim();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Sending…';

    try {
      const res = await fetch(SEND_OTP, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send code.');

      document.getElementById('otpSentTo').textContent = 'Sent to ' + currentEmail;
      document.getElementById('stepRequest').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Send code';
    }
  });

  document.getElementById('backLink').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('stepOtp').style.display = 'none';
    document.getElementById('stepRequest').style.display = 'block';
  });

  document.querySelectorAll('.otp-boxes input').forEach((box, i, boxes) => {
    box.addEventListener('input', () => { if (box.value && boxes[i + 1]) boxes[i + 1].focus(); });
  });

  document.getElementById('otpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = Array.from(document.querySelectorAll('.otp-boxes input')).map(b => b.value).join('');
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Verifying…';

    try {
      const res = await fetch(VERIFY_OTP, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, code }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Invalid code.');

      sessionStorage.setItem('ug_email', data.email);
      sessionStorage.setItem('ug_packs', JSON.stringify(data.packs));
      window.location.href = 'dashboard.html';
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Verify & continue';
    }
  });
</script>
</script>
<footer style="border-top: 1px solid var(--rule); padding: 24px 0; margin-top: 40px;">
  <div class="wrap" style="display:flex; gap:20px; font-size:13px; color:var(--ink-faint);">
    <a href="refund-policy.html" style="color:inherit;">Refund Policy</a>
    <a href="privacy-policy.html" style="color:inherit;">Privacy Policy</a>
    <a href="terms.html" style="color:inherit;">Terms of Service</a>
  </div>
</footer> 
</body>
</html>
